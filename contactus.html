<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 - 慢步·遊日記</title>
    <link rel="icon" type="image/x-icon" href="assets/images/Favicon.png">
    <link rel="stylesheet" href="assets/css/css-for-all-pages.css">
    <link rel="stylesheet" href="assets/css/css-nav.css">
    <link rel="stylesheet" href="assets/css/css-footer.css">
    <style>
        main {
            margin-left: 200px;
            margin-right: 200px;
        }

        @media (max-width: 1200px) {
            main {
                margin-left: 20px;
                margin-right: 20px;
            }
        }

        h1 {
            text-align: center;
            font-size: 2em;
            margin: 30px 0px;
            color: #4A4A4A;
        }

        p {
            font-size: 20px;
            line-height: 2;
        }

        .yellow-line {
            width: 100px;
            height: 3px;
            background-color: #FFD700;
            /* 黃色線 */
            margin: 0 auto 40px;
            /* 置中 + 下面空間 */
        }

        .about-content {
            display: flex;
            align-items: flex-start;
            gap: 30px;
            margin-bottom: 60px;
        }

        .author-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            /* 圓形 */
            border: 3px solid #FFC709;
            /* 黃色圈圈 */
            object-fit: cover;
            flex-shrink: 0;
        }

        .photo-caption {
            text-align: center;
            font-size: 0.9em;
            font-style: italic;
            color: #666;
            margin: 10px 0 0 0;
            width: 150px;
            /* 同相寬度對齊 */
        }

        .text-content {
            flex: 1;
            margin-left: 20px;
            /* 文字靠右，留空間畀相 */
        }

        .text-content h2 {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #4abded;
        }

        .text-content p {
            margin-bottom: 10px;
            text-align: justify;
        }

        @media (max-width: 675px) {
            .about-content {
                flex-direction: column;
                text-align: center;
            }

            .author-wrapper {
                margin: 0 auto;
                display: block;
            }

            .author-pic {
                margin: 0 auto;
            }

            .photo-caption {
                margin-left: auto;
                margin-right: auto;
                text-align: center;
            }

            .text-content {
                margin-left: 0;
            }
        }

        p {
            font-size: 20px;
            line-height: 2;
            margin: 10px 0;
        }

        .text-content ul {
            margin-left: 20px;
            /* 讓整個清單向右縮排，留出空間給黑點 */
            padding-left: 0;
        }

        .text-content li {
            margin-bottom: 10px;
            /* 項目之間的間距 */
        }

        /* 當螢幕小於 675px（手機和平板）時自動生效 */
        @media screen and (max-width: 675px) {
            p {
                font-size: 16px;
                /* 把手機版字體稍微調細（可自行改 15px 或 16px） */
                line-height: 1.6;
                /* 把行距收窄，避免上下罅隙太大 */
            }

        }
    </style>
    <!-- Google Adsense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7804659604247534"
        crossorigin="anonymous"></script>
</head>

<body>
    <div id="nav-placeholder"></div>


    <main>
        <h1>聯絡我們</h1>
        <div class="yellow-line"></div> <!-- 黃色線 -->

        <div class="about-content">


            <div class="text-content">
                <p><strong>生效日期： 2026年10月1日</strong></p>
                <p>歡迎光臨 <strong>慢步·遊日記</strong>（以下簡稱「本網站」）。如果你對本網站的內容有任何意見、查詢、合作建議，或者想交流日本旅遊的心得，非常歡迎隨時與我聯繫。</p>

                <h2>透過 Instagram 與我聯絡</h2>
                <p>為了確保訊息能最快回覆，本網站目前統一透過 <strong>Instagram DM（私訊）</strong> 與讀者交流：</p>


                <p>Instagram 帳號： stepsdiary.cc<a href="https://www.instagram.com/stepsdiary.cc/" target="_blank"
                        style="display: inline-flex; align-items: center; vertical-align: middle; margin-left: 10px;">
                        <img style="width: 30px; height: 30px;" src="assets/images/Instagram.webp" alt="Instagram">
                    </a></p>





                <h2>聯絡注意事項</h2>
                <p>傳送私訊時，請簡單說明你的來意（例如：<strong>旅遊文章詢問</strong>、<strong>合作邀約</strong>、<strong>網站建議</strong>等），我看到訊息後會盡快回覆。
                </p>
                <p>感謝你對本網站的支持與陪伴！</p>




            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>


    <script src="assets/js/call-nav.js"></script>
    <script src="assets/js/call-footer.js"></script>
</body>

</html>
