name: Auto Publish Scheduled Posts

on:
  schedule:
    - cron: '0 0 * * 6'  # 每日 UTC 00:00 (香港時間朝早 8 點)
  workflow_dispatch:       # 支援手動觸發

permissions:
  contents: write          # 必須要有寫入權限先推得上 repo

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run publish script
        run: node scripts/publish.js  # 請確保你的 JS 檔案路徑與此一致（例如放在 scripts/ 資料夾下）

      - name: Check for git changes & commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff-index --quiet HEAD; then
            echo "No changes to commit."
          else
            git commit -m "Auto-publish scheduled posts ($(date +%F))"
            git push origin HEAD
          fi